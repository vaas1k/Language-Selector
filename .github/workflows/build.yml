name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          trap 'rm -f keystore.properties "$RUNNER_TEMP/release.jks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon :app:assembleRelease

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum app/build/outputs/apk/release/app-release.apk | sed 's#app/build/outputs/apk/release/##' > SHA256SUMS

      - name: VirusTotal
        id: vt
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: app/build/outputs/apk/release/app-release.apk

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          echo "VirusTotal: ${VT_ANALYSIS#*=}" > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            SHA256SUMS
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
